<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>walnuts profile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<div class="pages"><div class="banner" aria-hidden="true"></div>
<main><div class="card" id="card">
<div id="slot-profile-head"></div>
<div class="sheet"><div class="grab"></div>
<div id="slot-bio"></div>
<div id="slot-player"></div>
<div class="rule"></div>
<div id="slot-highlight"></div>
<div class="tabs"><button class="btn sel" id="infoBtn" aria-expanded="true" aria-controls="info">INFO</button><button class="btn" id="postBtn" aria-expanded="false" aria-controls="posts">POST</button><button class="btn" id="threadBtn" aria-expanded="false" aria-controls="threads">THREAD</button></div>
<div id="slot-posts"></div>
<div id="slot-threads"></div>
<div id="slot-info"></div>
</div></div></main></div>

<!-- sections (each one fills in its slot above) -->
<script src="sections/profile.js"></script>
<script src="sections/player.js"></script>
<script src="sections/post.js"></script>
<script src="sections/highlight.js"></script>
<script src="sections/threads.js"></script>
<script src="sections/info.js"></script>
<!-- behavior -->
<script src="script.js"></script>
</body>
</html>
